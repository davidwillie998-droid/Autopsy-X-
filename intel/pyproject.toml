[project]
name = "autopsyx"
version = "0.1.0"
description = "Research core for the AUTOPSY X memecoin big-move intelligence engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["autopsyx*"]
