name: Pure Price Action Evaluator Tests

on:
  push:
    branches:
      - "claude/autopsy-flipdemon-extreme-l4ei3d"
    paths:
      - "tools/pure_price_action_evaluator.py"
      - "tests/test_pure_price_action_evaluator.py"
      - ".github/workflows/pure-price-action-tests.yml"
  pull_request:
    paths:
      - "tools/pure_price_action_evaluator.py"
      - "tests/test_pure_price_action_evaluator.py"
      - ".github/workflows/pure-price-action-tests.yml"

permissions:
  contents: read

jobs:
  pure-price-action-evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run pure price action evaluator tests
        run: python -m pytest tests/test_pure_price_action_evaluator.py -q
