name: FlipDemon Static Safety Audit

# Source-level regression checks only. This workflow does not compile MQL5 or
# validate broker fills; MetaEditor and MT5 Strategy Tester remain mandatory.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/autopsy-flipdemon-extreme-l4ei3d'
      - 'feat/flipdemon-account-campaign-coordination'
    paths:
      - 'MQL5/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'tests/test_flipdemon_adaptive_sizing_spec.py'
      - 'tests/test_flipdemon_campaign_coordination.py'
      - '.github/workflows/flipdemon-static-safety.yml'
  pull_request:
    paths:
      - 'MQL5/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'tests/test_flipdemon_adaptive_sizing_spec.py'
      - 'tests/test_flipdemon_campaign_coordination.py'
      - '.github/workflows/flipdemon-static-safety.yml'

permissions:
  contents: read

jobs:
  static-safety:
    name: Source safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adaptive sizing reference tests
        run: python -m unittest discover -s tests -p 'test_flipdemon_adaptive_sizing_spec.py' -v
      - name: Run campaign coordination reference tests
        run: python -m unittest discover -s tests -p 'test_flipdemon_campaign_coordination.py' -v
      - name: Verify critical safety invariants
        run: python scripts/verify_flipdemon_safety.py
