name: FlipDemon Static Safety Audit

# Source-level regression checks only. This workflow does not compile MQL5 or
# validate broker fills; MetaEditor and MT5 Strategy Tester remain mandatory.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/autopsy-flipdemon-extreme-l4ei3d'
    paths:
      - 'MQL5/**'
      - 'server/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'tests/test_flipdemon_adaptive_sizing_spec.py'
      - 'tests/test_flipdemon_account_risk.py'
      - 'tests/test_flipdemon_volume_profile_nodes.py'
      - 'tests/test_premium_discount_engine.py'
      - 'tests/test_daily_extreme_projection.py'
      - 'tests/test_orderflow_regime_scoring.py'
      - 'tests/test_liquidity_event_classification.py'
      - 'tests/test_flipdemon_shock_outcomes.py'
      - 'python/autopsy_research/shock_outcomes.py'
      - 'python/autopsy_research/shock_outcome_report.py'
      - 'tests/test_shock_outcome_report.py'
      - 'tests/test_flipdemon_mql5_hygiene.py'
      - 'tests/test_flipdemon_partial_recovery.py'
      - 'tests/test_flipdemon_distributed_risk_retry.py'
      - 'tests/test_flipdemon_score_evidence_contract.py'
      - 'tests/test_hedging_campaign_lifecycle_contract.py'
      - 'tests/test_position_state_registry_contract.py'
      - 'tests/test_break_even_persistence_contract.py'
      - 'tests/test_hedging_trailing_manager_contract.py'
      - 'tests/test_hedging_stop_action_recovery_contract.py'
      - 'tests/test_hedging_partial_close_ledger_contract.py'
      - 'tests/test_hedging_full_close_ledger_contract.py'
      - 'tests/test_hedging_full_close_lifecycle_contract.py'
      - 'tests/test_iq200_telemetry_static.py'
      - 'tests/test_advanced_trend_suite_static.py'
      - 'tests/test_advanced_session_orb_contract.py'
      - 'tests/test_precision_entry_engine_contract.py'
      - 'tests/test_fair_value_gap_engine.py'
      - 'tests/test_order_block_engine.py'
      - '.github/workflows/flipdemon-static-safety.yml'
  pull_request:
    paths:
      - 'python/autopsy_research/shock_outcomes.py'
      - 'python/autopsy_research/shock_outcome_report.py'
      - 'tests/test_flipdemon_shock_outcomes.py'
      - 'tests/test_shock_outcome_report.py'
      - 'docs/SHOCK_OUTCOME_RESEARCH.md'
      - 'MQL5/**'
      - 'server/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'tests/test_flipdemon_adaptive_sizing_spec.py'
      - 'tests/test_flipdemon_account_risk.py'
      - 'tests/test_flipdemon_volume_profile_nodes.py'
      - 'tests/test_premium_discount_engine.py'
      - 'tests/test_orderflow_regime_scoring.py'
      - 'tests/test_flipdemon_mql5_hygiene.py'
      - 'tests/test_flipdemon_partial_recovery.py'
      - 'tests/test_flipdemon_distributed_risk_retry.py'
      - 'tests/test_flipdemon_score_evidence_contract.py'
      - 'tests/test_hedging_campaign_lifecycle_contract.py'
      - 'tests/test_position_state_registry_contract.py'
      - 'tests/test_break_even_persistence_contract.py'
      - 'tests/test_hedging_break_even_manager_contract.py'
      - 'tests/test_hedging_trailing_manager_contract.py'
      - 'tests/test_hedging_stop_action_recovery_contract.py'
      - 'tests/test_hedging_partial_close_ledger_contract.py'
      - 'tests/test_advanced_session_orb_contract.py'
      - 'tests/test_fair_value_gap_engine.py'
      - 'tests/test_order_block_engine.py'
      - '.github/workflows/flipdemon-static-safety.yml'

permissions:
  contents: read

jobs:
  static-safety:
    name: Source safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install bridge dependencies
        working-directory: server
        run: npm ci
      - name: Run distributed risk ledger and HTTP integration tests
        working-directory: server
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run adaptive sizing reference tests
        run: python -m unittest discover -s tests -p 'test_flipdemon_*.py' -v
      - name: Run IQ200 telemetry source-contract tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_iq200_telemetry_static.py tests/test_advanced_trend_suite_static.py tests/test_advanced_session_orb_contract.py tests/test_precision_entry_engine_contract.py tests/test_hedging_campaign_lifecycle_contract.py tests/test_position_state_registry_contract.py tests/test_break_even_persistence_contract.py tests/test_hedging_break_even_manager_contract.py tests/test_hedging_stop_action_recovery_contract.py tests/test_hedging_partial_close_ledger_contract.py tests/test_hedging_full_close_ledger_contract.py tests/test_hedging_full_close_lifecycle_contract.py tests/test_premium_discount_engine.py tests/test_daily_extreme_projection.py tests/test_fair_value_gap_engine.py tests/test_order_block_engine.py
          python -m pytest -q tests/test_orderflow_regime_scoring.py tests/test_liquidity_event_classification.py tests/test_flipdemon_shock_outcomes.py tests/test_shock_outcome_report.py
      - name: Verify critical safety invariants
        run: python scripts/verify_flipdemon_safety.py
