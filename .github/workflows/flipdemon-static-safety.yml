name: FlipDemon Static Safety Audit

# Source-level regression checks only. This workflow does not compile MQL5 or
# validate broker fills; MetaEditor and MT5 Strategy Tester remain mandatory.
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/autopsy-flipdemon-extreme-l4ei3d'
      - 'fix/flipdemon-extreme-safety-rebased-20261016'
      - 'research/flipdemon-monte-carlo-validation-20261017'
    paths:
      - 'MQL5/**'
      - 'python/research/**'
      - 'python/tests/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'docs/FLIPDEMON_SSRN_EXECUTION_EVIDENCE.md'
      - 'docs/FLIPDEMON_MONTE_CARLO_VALIDATION.md'
      - '.github/workflows/flipdemon-static-safety.yml'
  pull_request:
    paths:
      - 'MQL5/**'
      - 'python/research/**'
      - 'python/tests/**'
      - 'scripts/verify_flipdemon_safety.py'
      - 'docs/FLIPDEMON_MONTE_CARLO_VALIDATION.md'
      - '.github/workflows/flipdemon-static-safety.yml'

permissions:
  contents: read

jobs:
  static-safety:
    name: Source safety invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run architecture invariant tests
        run: python -m pytest -q python/tests/test_architecture_invariants.py
      - name: Run Monte Carlo validation tests
        run: python -m pytest -q python/tests/test_monte_carlo_validation.py
      - name: Verify critical safety invariants
        run: python scripts/verify_flipdemon_safety.py
