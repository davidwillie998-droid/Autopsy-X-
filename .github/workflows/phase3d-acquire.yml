name: Phase 3D independent acquisition

on:
  workflow_dispatch:
  push:
    branches: [phase3d-independent-validation]
    paths:
      - "intel/datasets/phase3d/ACQUISITION_REQUEST.json"
      - "intel/autopsyx/phase3d_acquire.py"
      - "intel/autopsyx/data/providers/geckoterminal.py"
      - ".github/workflows/phase3d-acquire.yml"

permissions:
  contents: write

# New acquisition commits supersede stale queued/running attempts. This prevents
# an old run from occupying the single acquisition slot indefinitely.
concurrency:
  group: phase3d-independent-acquisition
  cancel-in-progress: true

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Acquire Window A
        working-directory: intel
        env:
          AUTOPSYX_SOLANA_RPC_URL: ${{ secrets.AUTOPSYX_SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: python -m autopsyx.phase3d_acquire --request datasets/phase3d/ACQUISITION_REQUEST.json --window A --out-root datasets/phase3d/runs
      - name: Verify Window A
        working-directory: intel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("datasets/phase3d/runs/p3d-sol-20261008a")
          u=json.loads((p/"universe.json").read_text()); m=json.loads((p/"run.json").read_text())
          assert len(u["tokens"]) >= 85, f"Window A has only {len(u['tokens'])} tokens"
          assert m["status"] == "COMPLETE", f"Window A status: {m['status']}"
          assert m["phase3d"]["contamination_check"] is True
          PY
      - name: Acquire Window B
        working-directory: intel
        env:
          AUTOPSYX_SOLANA_RPC_URL: ${{ secrets.AUTOPSYX_SOLANA_RPC_URL || 'https://api.mainnet-beta.solana.com' }}
        run: python -m autopsyx.phase3d_acquire --request datasets/phase3d/ACQUISITION_REQUEST.json --window B --out-root datasets/phase3d/runs
      - name: Verify independence
        working-directory: intel
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a=Path("datasets/phase3d/runs/p3d-sol-20261008a"); b=Path("datasets/phase3d/runs/p3d-sol-20261008b")
          ua=set(json.loads((a/"universe.json").read_text())["tokens"]); ub=set(json.loads((b/"universe.json").read_text())["tokens"])
          ma=json.loads((a/"run.json").read_text()); mb=json.loads((b/"run.json").read_text())
          assert len(ua) >= 85, f"Window A has only {len(ua)} distinct tokens"
          assert len(ub) >= 85, f"Window B has only {len(ub)} distinct tokens"
          assert not (ua & ub), f"Phase 3D token overlap: {len(ua & ub)}"
          assert ma["status"] == "COMPLETE", f"Window A status: {ma['status']}"
          assert mb["status"] == "COMPLETE", f"Window B status: {mb['status']}"
          assert ma["phase3d"]["contamination_check"] is True
          assert mb["phase3d"]["contamination_check"] is True
          print(f"Phase 3D acquisition PASS: A={len(ua)}, B={len(ub)}")
          PY
      - name: Seal canonical datasets
        if: always()
        working-directory: intel
        run: |
          set -euo pipefail
          for run in p3d-sol-20261008a p3d-sol-20261008b; do
            if [ -f "datasets/phase3d/runs/$run/run.json" ]; then
              python -m autopsyx seal "datasets/phase3d/runs/$run"
            fi
          done
      - name: Verify provenance
        if: always()
        working-directory: intel
        run: |
          set -euo pipefail
          found=0
          for run in p3d-sol-20261008a p3d-sol-20261008b; do
            if [ -f "datasets/phase3d/runs/$run/run.json" ]; then
              found=1
              python -m autopsyx verify-provenance "datasets/phase3d/runs/$run" > "datasets/phase3d/runs/$run/runner_verify.json"
              python - <<PY
          import json
          from pathlib import Path
          p=Path("datasets/phase3d/runs/$run/runner_verify.json")
          d=json.loads(p.read_text())
          print(f"Provenance result for $run: {d}")
          # The CLI must exit non-zero on verification failure; this additionally
          # rejects explicit false status fields when the verifier reports JSON.
          for key in ("ok", "valid", "passed"):
              if key in d:
                  assert d[key] is True, f"$run provenance field {key}={d[key]!r}"
                  break
          PY
            fi
          done
          test "$found" -eq 1 || { echo "No acquisition archives found to verify" >&2; exit 1; }
      - name: Upload acquisition artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3d-acquisition-${{ github.run_id }}
          path: intel/datasets/phase3d/runs
          retention-days: 30
      - name: Commit acquisition archives
        if: always()
        run: |
          set -euo pipefail
          git config user.name "autopsyx-acquisition"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          git add intel/datasets/phase3d/runs
          if git diff --cached --quiet; then
            echo "No new acquisition archives to commit."
          else
            git commit -m "Phase 3D independent acquisition: windows A and B (workflow ${{ github.run_id }})"
          fi
          # A docs/test commit may land while data is being acquired. Retry a
          # fast-forward-safe push after rebasing only the isolated archive commit.
          pushed=0
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              pushed=1
              break
            fi
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
          done
          test "$pushed" -eq 1 || { echo "Could not push acquisition archives after 3 attempts" >&2; exit 1; }
