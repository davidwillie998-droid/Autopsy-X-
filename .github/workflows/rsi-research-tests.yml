name: RSI Rotation Research Tests

on:
  pull_request:
    paths:
      - "scripts/research/rsi_rotation_baseline.py"
      - "tests/research/**"
      - ".github/workflows/rsi-research-tests.yml"
  push:
    branches:
      - "claude/autopsy-flipdemon-extreme-l4ei3d"
    paths:
      - "scripts/research/rsi_rotation_baseline.py"
      - "tests/research/**"
      - ".github/workflows/rsi-research-tests.yml"

permissions:
  contents: read

jobs:
  rsi-rotation-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas
      - name: Run RSI rotation unit tests
        run: python -m unittest discover -s tests/research -p "test_*.py" -v
