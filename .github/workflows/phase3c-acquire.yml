name: Phase 3C data acquisition

# Phase 3C uses the repository's canonical acquire/seal/verify implementation.
# A failed or interrupted acquisition must never be sealed as a completed run.
# Read-only acquisition: no orders, no wallets, no keys.

on:
  # Each dispatch must supply a new immutable run ID; the frozen request stays unchanged.
  workflow_dispatch:
    inputs:
      run_id:
        description: "Unique run ID, e.g. p3c-sol-20261021b (never reuse an archive ID)"
        required: true
        type: string
  push:
    branches: [ccr-dea9382c-vwhvi6]
    paths: ["intel/datasets/phase3c/REQUEST.json"]

permissions:
  contents: write

concurrency:
  group: phase3c-acquire
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate request and reserve a new immutable run ID (local-only)
        working-directory: intel
        env:
          DISPATCH_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          python -m autopsyx.research.phase3c_preflight datasets/phase3c/REQUEST.json
          FROZEN_RUN_ID=$(python -c "import json;print(json.load(open('datasets/phase3c/REQUEST.json'))['run_id'])")
          REQUEST_PATH="datasets/phase3c/REQUEST.json"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RUN_ID="$DISPATCH_RUN_ID"
            if [[ ! "$RUN_ID" =~ ^p3c-sol-[A-Za-z0-9_-]{1,64}$ ]]; then
              echo "FAIL: run_id must match p3c-sol-[A-Za-z0-9_-]{1,64}" >&2
              exit 2
            fi
            python - "$RUN_ID" "$RUNNER_TEMP/phase3c-request.json" <<'PY'
          import json, sys
          from pathlib import Path
          request = json.loads(Path("datasets/phase3c/REQUEST.json").read_text(encoding="utf-8"))
          request["run_id"] = sys.argv[1]
          Path(sys.argv[2]).write_text(json.dumps(request, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
            REQUEST_PATH="$RUNNER_TEMP/phase3c-request.json"
          else
            RUN_ID="$FROZEN_RUN_ID"
          fi
          python -m autopsyx.research.phase3c_preflight "$REQUEST_PATH"
          if [ -e "datasets/phase3c/runs/$RUN_ID" ]; then
            echo "FAIL: refusing to reuse immutable archive ID $RUN_ID" >&2
            exit 2
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "REQUEST_PATH=$REQUEST_PATH" >> "$GITHUB_ENV"
      - name: Acquire
        id: acquire
        working-directory: intel
        env:
          AUTOPSYX_SOLANA_RPC_URL: ${{ secrets.AUTOPSYX_SOLANA_RPC_URL }}
        run: python -m autopsyx --log acquire --live --request "$REQUEST_PATH" --out "datasets/phase3c/runs/$RUN_ID"
      - name: Preserve effective and frozen request inputs
        if: steps.acquire.outcome == 'success'
        working-directory: intel
        run: |
          cp datasets/phase3c/REQUEST.json "datasets/phase3c/runs/$RUN_ID/frozen_request.json"
          cp "$REQUEST_PATH" "datasets/phase3c/runs/$RUN_ID/request.json"
          sha256sum "datasets/phase3c/runs/$RUN_ID/frozen_request.json" "datasets/phase3c/runs/$RUN_ID/request.json" > "datasets/phase3c/runs/$RUN_ID/request_hashes.sha256"
          PY
      - name: Snapshot Phase 3C raw manifest before canonical normalization
        id: manifest_snapshot
        if: steps.acquire.outcome == 'success'
        working-directory: intel
        run: python -m autopsyx.research.phase3c_manifest_integrity snapshot "datasets/phase3c/runs/$RUN_ID"
      - name: Seal canonical dataset on the runner
        id: seal
        if: steps.manifest_snapshot.outcome == 'success'
        working-directory: intel
        run: python -m autopsyx seal "datasets/phase3c/runs/$RUN_ID"
      - name: Seal Phase 3C raw-manifest integrity
        id: manifest_seal
        if: steps.seal.outcome == 'success'
        working-directory: intel
        run: python -m autopsyx.research.phase3c_manifest_integrity seal "datasets/phase3c/runs/$RUN_ID"
      - name: Verify provenance on the runner
        id: verify
        if: steps.manifest_seal.outcome == 'success'
        working-directory: intel
        run: python -m autopsyx verify-provenance "datasets/phase3c/runs/$RUN_ID" > "datasets/phase3c/runs/$RUN_ID/runner_verify.json"
      - name: Verify Phase 3C raw-manifest integrity
        id: verify_manifest
        if: always() && steps.manifest_seal.outcome == 'success'
        working-directory: intel
        run: python -m autopsyx.research.phase3c_manifest_integrity verify "datasets/phase3c/runs/$RUN_ID" > "datasets/phase3c/runs/$RUN_ID/manifest_integrity_verify.json"
      - name: Record failed or interrupted acquisition
        if: (failure() || cancelled()) && env.RUN_ID != ''
        working-directory: intel
        env:
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          p = Path("datasets/phase3c/runs") / __import__("os").environ["RUN_ID"] / "run.json"
          if p.exists():
              meta = json.loads(p.read_text(encoding="utf-8"))
              # Preserve COMPLETE only when acquisition itself finished cleanly.
              # Any other status, including RUNNING, must not masquerade as a resumable run.
              if meta.get("status") != "COMPLETE":
                  meta["status"] = "FAILED_OR_INTERRUPTED"
              meta.setdefault("ended_ms", int(time.time() * 1000))
              meta["workflow_failure_recorded"] = True
              p.write_text(json.dumps(meta, indent=2, sort_keys=True) + "\n", encoding="utf-8")
      - name: Commit raw archive and verification evidence
        if: always() && env.RUN_ID != ''
        run: |
          git config user.name "autopsyx-acquisition"
          git config user.email "actions@users.noreply.github.com"
          git add "intel/datasets/phase3c/runs/$RUN_ID"
          git diff --cached --quiet && exit 0
          git commit -m "Phase 3C raw archive: $RUN_ID (acquired by workflow run ${{ github.run_id }})"
          for i in 1 2 3 4; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0; sleep $((2**i)); done
          exit 1
