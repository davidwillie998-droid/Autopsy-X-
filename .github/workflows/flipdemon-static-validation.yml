name: FlipDemon Static Safety Validation

on:
  pull_request:
    paths:
      - "MQL5/**"
      - "python/tests/test_architecture_invariants.py"
      - ".github/workflows/flipdemon-static-validation.yml"
  push:
    branches:
      - "fix/flipdemon-extreme-safety-audit"
    paths:
      - "MQL5/**"
      - "python/tests/test_architecture_invariants.py"
      - ".github/workflows/flipdemon-static-validation.yml"

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --upgrade pytest
      - name: Run MQL5 source architecture and safety invariants
        run: python -m pytest -q python/tests/test_architecture_invariants.py
