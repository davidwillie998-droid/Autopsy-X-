name: Intelligence engine tests

on:
  push:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml"]
  pull_request:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Plain PostgreSQL 16. TimescaleDB is not installed; the tests stub
      # create_hypertable, so hypertable behaviour itself is not exercised here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOPSYX_PG: "host=localhost port=5432 user=postgres password=postgres"
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v5
        with:
          # Phase 2 rule-freeze and Phase 3B immutability tests inspect historical commits.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install "pytest==9.1.1"
      - name: Re-render derived Phase 2 documents for verification
        # Phase 2 evidence/report artifacts remain frozen in git. The renderer changed
        # after those artifacts were generated, so CI regenerates only the derived
        # documents in the ephemeral workspace before asserting exact rendering.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from autopsyx.research import phase2_verify

          evidence = json.loads(Path("../artifacts/phase2/PHASE2_EVIDENCE.json").read_text())
          Path("../docs/PHASE2_REPORT.md").write_text(phase2_verify.render(evidence))
          Path("../docs/PHASE2_SYSTEM_STATUS.md").write_text(phase2_verify.render_status(evidence))
          PY
      - run: python -m pytest -q -rs
      - run: python -m autopsyx demo
