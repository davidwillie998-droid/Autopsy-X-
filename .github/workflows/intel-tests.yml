name: Intelligence engine tests

on:
  push:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml", ".github/workflows/phase3c-acquire.yml"]
  pull_request:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml", ".github/workflows/phase3c-acquire.yml"]

permissions:
  contents: read

# Push and pull_request both fire for a PR branch. Keep their concurrency groups
# separate: sharing one group with cancel-in-progress can cancel the very PR
# check we need to report, depending on which event starts last.
concurrency:
  group: intel-tests-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Plain PostgreSQL 16. TimescaleDB is not installed; the tests stub
      # create_hypertable, so hypertable behaviour itself is not exercised here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOPSYX_PG: "host=localhost port=5432 user=postgres"
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull requests, test the PR branch itself rather than GitHub's
          # synthetic merge commit. Historical scope checks must not mistake
          # files present only on the base branch for PR changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Historical provenance/scope tests need immutable Phase 2/3A/3B
          # commits available locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      # Verbose per-test output makes long-running or hanging tests identifiable
      # in the Actions log instead of leaving the suite apparently silent.
      - run: python -m pytest -vv -rs --durations=20
      - run: python -m autopsyx demo
