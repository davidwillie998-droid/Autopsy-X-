name: Intelligence engine tests

on:
  push:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml"]
  pull_request:
    paths: ["intel/**", "docs/**", ".github/workflows/intel-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Plain PostgreSQL 16. TimescaleDB is not installed; the tests stub
      # create_hypertable, so hypertable behaviour itself is not exercised here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOPSYX_PG: "host=localhost port=5432 user=postgres"
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v4
        with:
          # For pull requests, test the PR branch itself rather than GitHub's
          # synthetic merge commit. Historical scope checks must not mistake
          # files present only on the base branch for PR changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Historical provenance/scope tests need immutable Phase 2/3A/3B
          # commits available locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q -rs
      - name: Audit latest immutable Phase 3C evidence readiness
        run: |
          python -m autopsyx.research.phase3c_readiness_diagnostics datasets/phase3c/runs/p3c-sol-20261019a --out ../phase3c-readiness-p3c-sol-20261019a.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("../phase3c-readiness-p3c-sol-20261019a.json").read_text(encoding="utf-8"))
          assert report["diagnostic_only"] is True
          assert report["archive_integrity"]["status"] == "PASS"
          assert report["provider_reliability"]["status"] == "DEGRADED"
          assert report["transaction_history_completeness"]["status"] == "INCOMPLETE"
          assert report["historical_signal_readiness"]["status"] == "NOT_READY"
          assert report["normalization_replay"]["stored_vs_recomputed_match"] is True
          print(json.dumps({
              "archive": report["archive"],
              "archive_integrity": report["archive_integrity"]["status"],
              "provider_reliability": report["provider_reliability"]["status"],
              "provider_terminal_errors": report["provider_reliability"]["overall"]["terminal_errors"],
              "transaction_history": report["transaction_history_completeness"]["status"],
              "signatures_not_fetched": report["transaction_history_completeness"]["totals"]["signatures_not_fetched_reported"],
              "historical_signal_readiness": report["historical_signal_readiness"]["status"],
              "normalization_replay_match": report["normalization_replay"]["stored_vs_recomputed_match"],
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3c-evidence-readiness
          path: phase3c-readiness-p3c-sol-20261019a.json
          if-no-files-found: error
          retention-days: 30
      - name: Recompute offline Phase 3C cross-archive evidence
        working-directory: intel
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          from autopsyx.research import phase3c_pipeline as pipeline
          from autopsyx.research import phase3c_render as render

          out = pipeline.run(Path("/tmp/phase3c-cross-archive-work"))
          dest = Path("../phase3c-cross-archive-refresh")
          dest.mkdir(parents=True, exist_ok=True)
          (dest / "evidence.json").write_text(json.dumps(out, indent=2, sort_keys=True, default=str) + "\n", encoding="utf-8")
          pipeline.write_ledger(out, dest / "research_ledger.csv")
          (dest / "statistical_report.md").write_text(render.render_statistical_report(out), encoding="utf-8")
          (dest / "data_audit.md").write_text(render.render_data_audit(out), encoding="utf-8")
          (dest / "provenance_report.md").write_text(render.render_provenance_report(out), encoding="utf-8")
          (dest / "replication_report.md").write_text(render.render_replication_report(out), encoding="utf-8")
          (dest / "system_status.md").write_text(render.render_system_status(out), encoding="utf-8")

          summary = {
              "repository_commit": out["repository_commit"],
              "contract_hash": out["contract_hash"],
              "min_sample": out["min_sample"],
              "included_archives": out["included_archives"],
              "new_archives_excluded": out["new_archives_excluded"],
              "contamination_free": out["contamination"]["contamination_free"],
              "overlap_count": len(out["contamination"]["overlaps"]),
              "hypotheses": [{
                  "id": h["hypothesis_id"],
                  "distinct_tokens": h.get("n_distinct_tokens"),
                  "rows": h.get("n_rows_joined"),
                  "classification": h["classification"],
                  "reason": h["reason"],
              } for h in out["hypotheses"]],
              "overall": out["overall_classification"],
          }
          (dest / "summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(summary, sort_keys=True))
          assert out["min_sample"] == 85, "Frozen minimum sample changed"
          assert "p3c-sol-20261019a" in out["included_archives"], "Latest archive did not pass the pipeline's eligibility gate"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase3c-cross-archive-refresh
          path: phase3c-cross-archive-refresh/
          if-no-files-found: error
          retention-days: 30
      - run: python -m autopsyx demo
