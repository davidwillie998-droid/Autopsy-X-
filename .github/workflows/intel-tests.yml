name: Intelligence engine tests

on:
  push:
    paths: ["intel/**", "docs/research/**", ".github/workflows/intel-tests.yml"]
  pull_request:
    paths: ["intel/**", "docs/research/**", ".github/workflows/intel-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest -q
      - run: python -m autopsyx demo
