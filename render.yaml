services:
  - type: web
    name: autopsy-x-dashboard
    runtime: static
    buildCommand: "true"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: autopsy-x-bridge
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BRIDGE_KEY
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ALLOWED_ORIGIN
        value: https://autopsy-x-dashboard.onrender.com
      # Configure these in Render only after attaching and verifying a persistent disk.
      # Never set the acknowledgement to CONFIRMED before verifying durable storage.
      - key: RISK_COORDINATOR_KEY
        sync: false
      - key: RISK_LEDGER_PATH
        sync: false
      - key: RISK_LEDGER_PERSISTENCE_ACK
        sync: false
